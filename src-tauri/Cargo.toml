[package]
name = "nexterm"
version = "0.1.14"
license = "MIT OR Apache-2.0"
description = "Nexterm - Modern SSH & Local Terminal Client"
authors = ["Nexterm Contributors"]
edition = "2021"

[lib]
name = "nexterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9"
base64 = "0.22"
aes = "0.9"
blowfish = { version = "0.10", features = ["bcrypt"] }
cbc = "0.2"
pbkdf2 = "0.13"
sha3 = "0.12"
zeroize = "1"
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
serialport = { version = "4", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
windows-sys = { version = "0.52", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Com"] }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
tauri-plugin-window-state = "2"
ring = "0.17"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
russh-sftp = "3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "system-proxy", "socks"] }
alacritty_terminal = "0.26"
zstd = "0.13"
regex = "1"
memchr = "2"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
# RDP / VNC panes (desktop/). The IronRDP crates must stay on one release line (connector
# 0.12 / pdu 0.11): mixing lines duplicates their types. The older meta crate `ironrdp` 0.17
# pins a picky release whose curve25519-dalek pre-release conflicts with russh.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-cliprdr = "0.9"
ironrdp-cliprdr-native = "0.9"
ironrdp-rdpdr = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpsnd-native = "0.8"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
smallvec = "1"
vnc-rs = "0.6"

# 0.11.0 acknowledges only the training payload, not the packet size. Strict
# servers then withhold audio. Drop these overrides once #2294 is released.
[patch.crates-io]
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "f86e3c49f349127b7e7f3c737ca10de49cc20f8d" }

# Keep the patched crate's public types identical to the registry ones.
[patch."https://github.com/Devolutions/IronRDP"]
ironrdp-core = { version = "0.3", registry = "crates-io" }
ironrdp-dvc = { version = "0.10", registry = "crates-io" }
ironrdp-pdu = { version = "0.11", registry = "crates-io" }
ironrdp-svc = { version = "0.10", registry = "crates-io" }

[dev-dependencies]
bcrypt-pbkdf = "0.11"
